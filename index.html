Set redirection by going to <a href="./set.html">the set page</a> with the query "redirect" set to the redirect uri<br>
ex: https://michaelykersey.github.io/redirector/set.html?redirect=https://google.com<br>
<br>
Be redirected by going to <a href="./redirect.html">the redirect page</a><br>
currently your redirect is set to "<a id="url"></a>"<br>
<script type="module">
    import {readCookie} from './cookies.js';
    const oldElement = document.getElementById("url");
    const newElement = document.createElement('a')
    const url = readCookie('redirect');
    newElement.textContent = url;
    newElement.href = url;
    oldElement.replaceWith(newElement);
</script>
